name: HW5 Performance tests

on:
  push:
    branches: [homework5-v2]
    paths:
      - 'HW5/**'
      - '.github/workflows/github-actions-performance.yml'
  workflow_dispatch:

env:
  HW5_ROOT: HW5/23127173_HW05_AI_Performance_095
  HW5_BACKEND_DIR: eshop-sut/backend
  JMETER_VERSION: 5.6.3

jobs:
  performance-tests:
    name: Load + Stress + Spike
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout EShop SUT
        uses: actions/checkout@v4
        with:
          repository: ttbhanh/eshop-sut
          path: eshop-sut

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SUT dependencies
        run: npm ci --prefix eshop-sut/backend

      - name: Install Apache JMeter
        run: |
          curl -fsSL "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz" -o jmeter.tgz
          tar -xzf jmeter.tgz
          echo "$PWD/apache-jmeter-${JMETER_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Start SUT
        run: |
          node eshop-sut/backend/server.js > eshop.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:3000/api/products && exit 0
            sleep 1
          done
          echo "SUT failed to start"
          cat eshop.log
          exit 1

      - name: Run Load test
        env:
          HW5_BACKEND_DIR: eshop-sut/backend
        run: |
          set -euo pipefail
          HW5="${{ env.HW5_ROOT }}"
          STAMP="20260831"
          CSV="$(pwd)/${HW5}/performance/data/hw5-users.local.csv"
          JTL="$(pwd)/${HW5}/performance/raw-jtl/23127173_Load_${STAMP}.jtl"
          HTML="$(pwd)/${HW5}/performance/html-reports/23127173_Load_${STAMP}"
          rm -f "$JTL"
          rm -rf "$HTML"
          node "${HW5}/scripts/reset-seed-hw5.mjs"
          jmeter -n \
            -J"hw5.data.file=${CSV}" \
            -t "${HW5}/performance/test-plans/23127173_Load_${STAMP}.jmx" \
            -l "$JTL" \
            -e -o "$HTML"

      - name: Compare Load with baseline gate
        run: |
          node "${{ env.HW5_ROOT }}/continuous-performance-testing/compare-performance-baseline.mjs" \
            "${{ env.HW5_ROOT }}/performance/raw-jtl/23127173_Load_20260831.jtl" \
            "${{ env.HW5_ROOT }}/continuous-performance-testing/baseline.json"

      - name: Run Stress test
        env:
          HW5_BACKEND_DIR: eshop-sut/backend
        run: |
          set -euo pipefail
          HW5="${{ env.HW5_ROOT }}"
          STAMP="20260831"
          CSV="$(pwd)/${HW5}/performance/data/hw5-users.local.csv"
          JTL="$(pwd)/${HW5}/performance/raw-jtl/23127173_Stress_${STAMP}.jtl"
          HTML="$(pwd)/${HW5}/performance/html-reports/23127173_Stress_${STAMP}"
          rm -f "$JTL"
          rm -rf "$HTML"
          node "${HW5}/scripts/reset-seed-hw5.mjs"
          jmeter -n \
            -J"hw5.data.file=${CSV}" \
            -t "${HW5}/performance/test-plans/23127173_Stress_${STAMP}.jmx" \
            -l "$JTL" \
            -e -o "$HTML"

      - name: Run Spike test
        env:
          HW5_BACKEND_DIR: eshop-sut/backend
          HW5_ACCOUNT_COUNT: 50
        run: |
          set -euo pipefail
          HW5="${{ env.HW5_ROOT }}"
          STAMP="20260831"
          CSV="$(pwd)/${HW5}/performance/data/hw5-users.local.csv"
          JTL="$(pwd)/${HW5}/performance/raw-jtl/23127173_Spike_${STAMP}.jtl"
          HTML="$(pwd)/${HW5}/performance/html-reports/23127173_Spike_${STAMP}"
          rm -f "$JTL"
          rm -rf "$HTML"
          node "${HW5}/scripts/reset-seed-hw5.mjs"
          jmeter -n \
            -J"hw5.data.file=${CSV}" \
            -t "${HW5}/performance/test-plans/23127173_Spike_${STAMP}.jmx" \
            -l "$JTL" \
            -e -o "$HTML"

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw5-performance-jtl-html
          path: |
            ${{ env.HW5_ROOT }}/performance/raw-jtl/23127173_Load_20260831.jtl
            ${{ env.HW5_ROOT }}/performance/raw-jtl/23127173_Stress_20260831.jtl
            ${{ env.HW5_ROOT }}/performance/raw-jtl/23127173_Spike_20260831.jtl
            ${{ env.HW5_ROOT }}/performance/html-reports/23127173_Load_20260831/
            ${{ env.HW5_ROOT }}/performance/html-reports/23127173_Stress_20260831/
            ${{ env.HW5_ROOT }}/performance/html-reports/23127173_Spike_20260831/
            eshop.log
